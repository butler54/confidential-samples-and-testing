apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  progressDeadlineSeconds: {{ add (int .Values.startup.timeoutSeconds) 1200 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- if or .Values.initdata.encoded (not .Values.initdata.configMapName) }}
        coco.io/skip-initdata: "true"
        {{- end }}
      annotations:
        io.katacontainers.config.hypervisor.default_memory: "2048"
        io.katacontainers.config.runtime.create_container_timeout: {{ max 900 (add (int .Values.startup.timeoutSeconds) 30) | quote }}
        {{- if .Values.initdata.encoded }}
        io.katacontainers.config.hypervisor.cc_init_data: {{ .Values.initdata.encoded | quote }}
        {{- else if .Values.initdata.configMapName }}
        coco.io/initdata-configmap: {{ .Values.initdata.configMapName | quote }}
        {{- end }}
    spec:
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      serviceAccountName: {{ .Release.Name }}-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: storage-helper
          image: {{ .Values.images.storageHelper | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [sh, /opt/sample/format-storage.sh]
          securityContext: {runAsUser: 0, privileged: true}
          resources:
            {{- toYaml .Values.resources.storageHelper | nindent 12 }}
          volumeDevices:
            - {name: block, devicePath: /dev/block-device}
          volumeMounts:
            - {name: scripts, mountPath: /opt/sample, readOnly: true}
      containers:
        - name: application
          image: {{ .Values.images.storageHelper | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [sh, /opt/sample/main.sh]
          # Lab-only privileges: mount the raw device inside the Kata guest.
          securityContext: {runAsUser: 0, privileged: true}
          env:
            - {name: DATA_DIR, value: /mnt/storage}
            - {name: EXPECTED_SOURCE, value: /dev/block-device}
            - {name: STARTUP_TIMEOUT, value: {{ .Values.startup.timeoutSeconds | quote }}}
            - {name: FILE_NAME, value: {{ printf "sample-%s-%s-%s.txt" .Chart.Name .Release.Name (.Release.Namespace | sha256sum | trunc 8) | quote }}}
          resources:
            {{- toYaml .Values.resources.application | nindent 12 }}
          startupProbe:
            exec: {command: [sh, /opt/sample/readiness.sh]}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: {{ add (div (int .Values.startup.timeoutSeconds) 5) 10 }}
          readinessProbe:
            exec: {command: [sh, /opt/sample/readiness.sh]}
            periodSeconds: 5
            timeoutSeconds: 5
          volumeDevices:
            - {name: block, devicePath: /dev/block-device}
          volumeMounts:
            - {name: scripts, mountPath: /opt/sample, readOnly: true}
            - {name: control, mountPath: /run/sample}
      volumes:
        - name: scripts
          configMap: {name: {{ .Release.Name }}-scripts, defaultMode: 365}
        - name: control
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: block
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-block}
