apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sample.name" . }}-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample.labels" . | nindent 4 }}
  {{- with .Values.resourceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
{{ (.Files.Glob "scripts/*.sh").AsConfig | indent 2 }}
