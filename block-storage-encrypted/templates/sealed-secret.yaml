{{- if and (eq .Values.keyDelivery.mode "sealed") .Values.keyDelivery.sealed.envelope }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sample.name" . }}-envelope
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample.labels" . | nindent 4 }}
  {{- with .Values.resourceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  envelope: {{ .Values.keyDelivery.sealed.envelope | quote }}
{{- end }}
