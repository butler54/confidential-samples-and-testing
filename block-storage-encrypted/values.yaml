# Encrypted block storage: exactly one key-delivery path.
runtimeClassName: kata-cc
initdata:
  configMapName: debug-initdata # Existing same-namespace ConfigMap; empty selects cluster default.
  encoded: "" # Explicit compressed/base64 initdata wins over configMapName.
images:
  storageHelper: registry.redhat.io/openshift-sandboxed-containers/osc-storage-helper:1.13.1
  utility: registry.access.redhat.com/ubi9/ubi:9.6 # Curl init container only.
imagePullPolicy: IfNotPresent
imagePullSecrets: [] # Existing registry Secret references.
storage:
  size: 1Gi
  storageClass: null # Omit selection: cluster default, which must support Block and Delete.
startup:
  timeoutSeconds: 900 # Mount/access deadline; polling is fixed at 2 seconds.
resources:
  application:
    requests: {cpu: 100m, memory: 2560Mi}
    limits: {cpu: "1", memory: 2560Mi} # Includes 2048Mi guest RAM and hypervisor overhead.
  storageHelper:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 256Mi}
  utility:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 256Mi}
security:
  sccBinding:
    create: false # Administrator opt-in for this release's account only.
    name: privileged # Existing lab SCC permitting guest mounting.
keyDelivery:
  mode: curl # curl, sealed, insecureSecret; no fallback between modes.
  resourcePath: default/kbsres1/key3 # One preconfigured Trustee encryption-key resource.
  secret:
    name: "" # Existing Secret required for sealed/insecureSecret; empty for curl.
    key: passphrase # For sealed mode, select the key holding the genuine CoCo vault token.
