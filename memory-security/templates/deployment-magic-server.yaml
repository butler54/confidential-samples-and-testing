apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-magic
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: memory-security-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: magic-server
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: magic-server
    spec:
{{- if .Values.imagePullSecrets }}
      imagePullSecrets: {{ .Values.imagePullSecrets | toYaml | nindent 8 }}
{{- end }}
      containers:
      - name: magic-server
        image: {{ .Values.images.magicServer }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8080
        resources: {{ .Values.resources.endpoint | toYaml | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: content
          mountPath: /var/www/html/magic.txt
          subPath: magic.txt
      volumes:
      - name: content
        configMap:
          name: {{ .Release.Name }}-magic-string
