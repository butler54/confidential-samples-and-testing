apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-standard
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: memory-security-demo
    demo.tier: standard
spec:
{{- if .Values.imagePullSecrets }}
  imagePullSecrets: {{ .Values.imagePullSecrets | toYaml | nindent 4 }}
{{- end }}
  initContainers:
  - name: fetch-key
    image: {{ .Values.images.demo }}
    imagePullPolicy: {{ .Values.imagePullPolicy }}
    command:
    - sh
    - -c
    - curl -ks https://{{ .Values.route.host }}/magic.txt -o /keys/magickey.txt
    volumeMounts:
    - name: keys
      mountPath: /keys
  containers:
  - name: demo
    image: {{ .Values.images.demo }}
    imagePullPolicy: {{ .Values.imagePullPolicy }}
    command:
    - sleep
    - infinity
    resources: {{ .Values.resources.demo | toYaml | nindent 6 }}
    securityContext:
      privileged: false
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: keys
      mountPath: /keys
  volumes:
  - name: keys
    emptyDir:
      medium: Memory
