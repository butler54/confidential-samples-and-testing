name: Validate examples
on:
  push:
    paths: ['block-storage-plain/**', 'block-storage-encrypted/**', 'nfs-direct/**', 'memory-security/**', 'kbs-client/**', 'io-benchmark/**', '.github/workflows/validate-examples.yml']
  pull_request:
    paths: ['block-storage-plain/**', 'block-storage-encrypted/**', 'nfs-direct/**', 'memory-security/**', 'kbs-client/**', 'io-benchmark/**', '.github/workflows/validate-examples.yml']
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart: [block-storage-plain, block-storage-encrypted, nfs-direct, memory-security, kbs-client, io-benchmark]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.12'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.22.0'
      - name: Install pinned static tools (not workload startup)
        env:
          CHART: ${{ matrix.chart }}
        run: python3 -m pip install -r "$CHART/tests/requirements.txt"
      - name: Lint and shellcheck standalone chart
        env:
          CHART: ${{ matrix.chart }}
        run: sh "$CHART/tests/run.sh"
      # No kubeconfig, registry credentials, live job, or untrusted PR secret is supplied.
