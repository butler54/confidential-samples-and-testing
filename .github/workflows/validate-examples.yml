name: Validate storage examples
on:
  push:
    paths: ['block-storage-plain/**', 'block-storage-encrypted/**', 'nfs-direct/**', '.github/workflows/validate-examples.yml']
  pull_request:
    paths: ['block-storage-plain/**', 'block-storage-encrypted/**', 'nfs-direct/**', '.github/workflows/validate-examples.yml']
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        chart: [block-storage-plain, block-storage-encrypted, nfs-direct]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: 'v3.22.0'
      - name: Install pinned static tools (not workload startup)
        env:
          CHART: ${{ matrix.chart }}
        run: python3 -m pip install -r "$CHART/tests/requirements.txt"
      - name: Lint and statically validate standalone chart
        env:
          CHART: ${{ matrix.chart }}
        run: sh "$CHART/tests/run.sh"
      # No kubeconfig, registry credentials, live job, or untrusted PR secret is supplied.
